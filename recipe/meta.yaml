{% set python_min = "3.11" %}
{% set name = "virtualship" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/virtualship-{{ version }}.tar.gz
  sha256: 3fb58dcb9b64ea926db32ed9a92b51c5b0244baa647b660585b5b0afe03d733f

build:
  entry_points:
    - virtualship = virtualship.cli.main:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - setuptools-scm >=8.0
    - pip
  run:
    - python >={{ python_min }}
    - click
    - parcels >=4
    - pyproj >=3,<4
    - sortedcontainers ==2.4.0
    - opensimplex ==0.4.5
    - numpy >=2.1.0
    - pydantic >=2,<3
    - pyyaml
    - copernicusmarine >=2.2.2
    - pandas
    - openpyxl
    - yaspin
    - textual

test:
  imports:
    - virtualship
  commands:
    - pip check
    - virtualship --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://virtualship.parcels-code.org/
  dev_url: https://github.com/Parcels-code/virtualship
  summary: Code for VirtualShip, where Marine Scientists can combine Copernicus Marine Data with a Parcels ship to go on a virtual expedition.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - j-atkins
    - ammedd
    - erikvansebille
    - VeckoTheGecko
